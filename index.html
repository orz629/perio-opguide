<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牙周手術決策選擇器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a2e; --muted:#5d6b6f; --line:#dde3e1; --paper:#f7f5f0; --card:#ffffff;
  --teal:#0f5c63; --teal-soft:#e3efee; --amber:#a3620a; --amber-soft:#fbf1e1;
  --red:#a33a2c; --red-soft:#f8e6e2; --green:#2f6b3a; --green-soft:#e6f1e6;
  --gA:#0f5c63; --gB:#4f7a8a; --g0:#8a8f8c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 64px}
header h1{font-family:"Noto Serif TC",serif;font-size:1.6rem;margin:4px 0 2px;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:.92rem}
.steps{display:flex;gap:4px;margin:20px 0 18px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:.78rem;color:var(--muted);cursor:pointer;user-select:none}
.steps li .bar{height:4px;border-radius:2px;background:var(--line);margin-bottom:6px;transition:background .2s}
.steps li.done .bar{background:#8fb5b1}
.steps li.on .bar{background:var(--teal)}
.steps li.on{color:var(--teal);font-weight:700}
.steps li.lock{cursor:default;opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px}
.card h2{font-family:"Noto Serif TC",serif;font-size:1.25rem;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.q{margin:18px 0 6px}
.q:first-of-type{margin-top:6px}
.q.miss{outline:2px solid var(--red);outline-offset:6px;border-radius:8px;scroll-margin-top:90px}
.q.miss .lab::after{content:"必填";font-size:.72rem;color:#fff;background:var(--red);border-radius:4px;padding:0 6px;font-weight:700}
.q .lab{font-weight:700;font-size:.98rem;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.q .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font:inherit;font-size:.93rem;color:var(--ink);cursor:pointer;text-align:left;transition:all .15s}
.opt:hover{border-color:#9fbfbb}
.opt.sel{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.opt.sel small{color:#3d7a7f}
.note{border-left:3px solid var(--line);padding:8px 12px;margin:12px 0 0;font-size:.88rem;color:var(--muted);background:#fbfaf7;border-radius:0 8px 8px 0}
.note.warn{border-color:var(--amber);background:var(--amber-soft);color:#6b4308}
.note.stop{border-color:var(--red);background:var(--red-soft);color:#6e2419}
.note.ok{border-color:var(--green);background:var(--green-soft);color:#24502c}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{font:inherit;border-radius:10px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:.76rem;border:1px solid #c9d6d4;background:#f3f7f6;color:var(--teal);border-radius:999px;padding:2px 10px;cursor:pointer}
.chip[aria-expanded="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.evbox{display:none;margin-top:8px;font-size:.84rem;background:#f3f7f6;border-radius:8px;padding:10px 12px;color:#2c4044}
.evbox.open{display:block}
.evbox .claim{margin:0 0 6px}
.evbox .bib{color:var(--muted)}
.evbox a{color:var(--teal)}
.tag{display:inline-block;font-size:.7rem;border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:1px;border:1px solid currentColor}
.res-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.res-sec:first-child{border-top:none;padding-top:0;margin-top:0}
.res-sec h3{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:700}
.rec{margin:0 0 12px}
.rec .t{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec .d{font-size:.92rem;margin-top:2px}
.grade{font-size:.7rem;font-weight:700;color:#fff;border-radius:4px;padding:1px 7px}
.grade.A{background:var(--gA)} .grade.B{background:var(--gB)} .grade.Z{background:var(--g0)}
.grade.E{background:#b08a4a} .grade.I{background:#9a6b8a}
.lvl-stop .t{color:var(--red)} .lvl-warn .t{color:var(--amber)}
.path{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.path span{font-size:.8rem;background:#eef1ef;border-radius:6px;padding:2px 8px;color:#3b4a4d}
.refs ol{padding-left:22px;margin:8px 0 0;font-size:.82rem;color:#3b4a4d}
.refs li{margin-bottom:6px}
.refs a{color:var(--teal)}
.legend{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
footer{font-size:.78rem;color:var(--muted);margin-top:24px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:520px){.steps li{font-size:.7rem}.card{padding:16px 14px}header h1{font-size:1.35rem}}
</style>
</head>

  三軍總醫院 牙周病科 陳穎吾
</footer>
</div>

/* ===================== 狀態 ===================== */
let S = {};
let cur = 0;
let showMiss = false;
try{ const sv = JSON.parse(localStorage.getItem("perioDT")||"null"); if(sv&&sv.S){S=sv.S;cur=sv.cur||0;} }catch(e){}
function save(){ try{localStorage.setItem("perioDT",JSON.stringify({S,cur}));}catch(e){} }

function visibleQs(id){ return (Q[id]||[]).filter(q=>!q.show||q.show(S)); }
function stepDone(i){ const id=STEPS[i].id; if(id==="res") return false; return visibleQs(id).every(q=>S[q.k]!==undefined); }
function stopped(){ return S.oh==="poor"||S.ppd==="closed"; }
function maxReach(){ let i=0; while(i<STEPS.length-1 && stepDone(i)){ if(i===0&&stopped()) return STEPS.length-1; i++; } return i; }

/* ===================== 渲染 ===================== */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
let chipId=0;
function evHTML(list){
  if(!list||!list.length) return "";
  const id="e"+(chipId++);
  let chips="", boxes="";
  list.forEach((e,i)=>{ const r=R[e.k]; const bid=id+"_"+i;
    chips+=`<button class="chip" aria-expanded="false" data-box="${bid}">${esc(r.a)}</button>`;
    boxes+=`<div class="evbox" id="${bid}"><p class="claim">${esc(e.c)}</p><div class="bib">${esc(r.t)}. <i>${esc(r.j)}</i>. ${esc(r.ty)}<span class="tag">${esc(r.src)}</span><br>PMID <a href="https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/" target="_blank" rel="noopener">${r.pmid}</a>${r.doi?` ・ DOI <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">${esc(r.doi)}</a>`:" ・ DOI ⚠ 待確認"}</div></div>`;
  });
  return `<div class="ev">${chips}</div>${boxes}`;
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const b=document.getElementById(c.dataset.box); const open=!b.classList.contains("open");
  c.parentElement.querySelectorAll(".chip").forEach(x=>{x.setAttribute("aria-expanded","false"); const bx=document.getElementById(x.dataset.box); if(bx) bx.classList.remove("open");});
  if(open){b.classList.add("open");c.setAttribute("aria-expanded","true");}
});

function renderSteps(){
  const mr=maxReach();
  $("#steps").innerHTML=STEPS.map((st,i)=>{
    const cls=[i===cur?"on":"", i<cur||stepDone(i)?"done":"", i>mr?"lock":""].join(" ");
    return `<li class="${cls}" data-i="${i}"><div class="bar"></div>${st.name}</li>`;}).join("");
  document.querySelectorAll("#steps li").forEach(li=>li.onclick=()=>{const i=+li.dataset.i; if(i<=maxReach()){showMiss=false;cur=i;render();}});
}

function stepNotes(id){
  let h="";
  if(id==="pt"){
    if(S.ppd==="closed") h+=`<div class="note ok">已達治療終點：不需手術，進入支持性牙周治療。</div>`;
    if(S.oh==="poor") h+=`<div class="note stop">口腔清潔未達標：依 EFP S3 R3.6 暫不手術，先回到第一、二步治療。</div>`;
    if(S.ppd==="mod") h+=`<div class="note warn">4–5 mm 原則上先重複齦下器械治療（R3.1）；若伴隨骨內缺損或根岔侵犯仍要評估手術，可繼續。</div>`;
    if(S.smk==="heavy") h+=`<div class="note warn">每日 > 10 支：再生結果明顯較差，建議先戒菸介入。</div>`;
    if(S.sys==="bad") h+=`<div class="note warn">全身狀況未控制：建議控制後再安排再生手術。</div>`;
  }
  if(id==="bone"&&S.type==="intra"&&S.depth==="lt3") h+=`<div class="note">&lt; 3 mm 的淺缺損屬切除性骨手術範圍；3 mm 是 R3.7 與 Carnevale 的交界，可依深度與型態調整。</div>`;
  return h;
}

function render(){
  chipId=0; const st=STEPS[cur]; renderSteps();
  if(st.id==="res"){ renderResult(); save(); return; }
  const qs=visibleQs(st.id);
  let h=`<section class="card"><h2>${st.title}</h2><p class="sub">${st.sub}</p>`;
  qs.forEach(q=>{
    const miss=showMiss&&S[q.k]===undefined;
    h+=`<div class="q${miss?" miss":""}" data-q="${q.k}"><div class="lab">${q.lab}${q.hint?`<span class="hint">${q.hint}</span>`:""}</div><div class="opts">`;
    q.opts.forEach(o=>{ h+=`<button class="opt${S[q.k]===o[0]?" sel":""}" data-k="${q.k}" data-v="${o[0]}">${o[1]}${o[2]?`<small>${o[2]}</small>`:""}</button>`; });
    h+=`</div>${evHTML(q.ev)}</div>`;
  });
  h+=stepNotes(st.id);
  h+=`</section><div class="nav"><button class="btn ghost" id="back" ${cur===0?"disabled":""}>上一步</button><button class="btn" id="next">${(cur===0&&stopped())?"看結果":"下一步"}</button></div>`;
  $("#main").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; S[k]=b.dataset.v;
    // 清掉已隱藏題目的答案
    Object.values(Q).flat().forEach(q=>{ if(q.show&&!q.show(S)) delete S[q.k]; });
    save(); render();
  });
  $("#back").onclick=()=>{ showMiss=false; if(cur===STEPS.length-1&&stopped()){cur=0;} else cur=Math.max(0,cur-1); render(); window.scrollTo(0,0); };
  $("#next").onclick=()=>{
    if(!stepDone(cur)){
      showMiss=true; render();
      const first=document.querySelector(".q.miss");
      if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
      toast("還有必填項目未選");
      return;
    }
    showMiss=false; cur=(cur===0&&stopped())?STEPS.length-1:cur+1; render(); window.scrollTo(0,0); };
  save();
}

/* ===================== 決策邏輯 ===================== */
function decide(){
  const out=[]; const sec=(title)=>{const s={title,items:[]};out.push(s);return s;};
  const add=(s,o)=>s.items.push(o);

  // 0 病人
  const p=sec("病人與牙齒條件");
  if(S.ppd==="closed"){ add(p,{g:"A",lvl:"ok",t:"已達治療終點，不需手術",d:"進入支持性牙周治療（SPT）。",ev:[ev("s3","治療終點：沒有 > 4 mm 伴探測出血的囊袋、沒有 ≥ 6 mm 深囊袋；達到者進入支持性牙周照護（p. 14）。")]}); return out; }
  if(S.oh==="poor"){ add(p,{g:"A",lvl:"stop",t:"暫不手術",d:"自我口腔清潔未達標。先加強口腔衛生指導與危險因子控制，回到第一、二步治療後再評估。",ev:[ev("s3","R3.6（Grade A，強烈共識）：未達到並維持適當自我口腔衛生的病人不做牙周手術。")]}); return out; }
  if(S.ppd==="mod") add(p,{g:"B",lvl:"warn",t:"4–5 mm：先考慮重複齦下器械治療",d:"EFP 對此深度建議重複齦下器械治療；以下手術建議適用於仍決定手術的位點。",ev:[ev("s3","R3.1（Grade B）：4–5 mm 殘留囊袋建議重複齦下器械治療；≥ 6 mm 建議翻瓣手術。")]});
  else add(p,{g:"B",t:"殘留 ≥ 6 mm：進入第三步手術治療",d:"",ev:[ev("s3","R3.1（Grade B）：第三期牙周炎第一、二步治療後殘留 ≥ 6 mm，建議翻瓣手術。")]});
  if(S.oh==="mid") add(p,{g:"E",lvl:"warn",t:"口腔清潔處於邊緣",d:"研究的手術門檻介於 ≤ 15% 到 ≤ 25%；再生手術建議先降到 < 15%。",ev:[ev("ct15","術前 FMPS < 15%、FMBS < 15%。"),ev("kao14","研究門檻 ≤ 15%、≤ 20% 或 ≤ 25%；SORT C。")]});
  if(S.smk==="heavy") add(p,{g:"A",lvl:"warn",t:"重度吸菸：再生預後差，先戒菸介入",d:"附連獲得約為不吸菸者的四成；長期附連再喪失風險高。",ev:[ev("ct15","> 10 支／日附連獲得 2.1 ± 1.2 mm，不吸菸 5.2 ± 1.9 mm。"),ev("ct04","附連喪失 ≥ 2 mm：吸菸 HR = 7.2。"),ev("s3","R1.6（Grade A）：實施戒菸介入。")]});
  if(S.smk==="light") add(p,{g:"E",lvl:"warn",t:"輕度吸菸：再生效益打折",d:"吸菸對附連獲得有劑量效應，術前說明預期並鼓勵戒菸。",ev:[ev("ct15","吸菸對附連獲得有劑量依賴的負面影響。"),ev("pat12","吸菸者骨獲得顯著較少。")]});
  if(S.sys==="bad") add(p,{g:"E",lvl:"warn",t:"全身狀況控制後再手術",d:"",ev:[ev("ct15","未控制的糖尿病或全身疾病屬術前須排除的不利條件。")]});
  if(S.endo==="need") add(p,{g:"E",lvl:"warn",t:"先完成根管治療",d:"不良根管治療先重做，再安排再生手術。",ev:[ev("ct15","牙髓治療須在再生手術前完成。")]});

  // 1 骨缺損 → 術式
  const b=sec("術式");
  let regen=false;
  const thin=S.pheno==="thin";
  if(S.type==="intra"&&S.depth==="ge3"){
    regen=true;
    if(S.walls==="mix") add(b,{g:"A",t:"再生手術（可先修整冠方淺壁）",d:"深部以再生處理；冠方淺 1–2 壁可修平，建立平整基底再對深部再生。部分切骨換淺囊袋要付出鄰牙附連代價。",ev:[ev("s3","R3.7（Grade A）：≥ 3 mm 骨內缺損建議再生手術。"),ev("och95","複合型缺損修平冠方淺壁，利於屏障膜貼合、減少塌陷，再對深部再生（專家意見）。"),ev("dur85","部分切除 vs 非切除：附連獲得 0.7 vs 1.1 mm；鄰牙附連喪失 1.2–1.5 vs 0.1–0.9 mm。")]});
    else add(b,{g:"A",t:"再生手術",d:"比單純翻瓣清創約多 1.3 mm 附連獲得，中長期仍維持優勢。",ev:[ev("s3","R3.7（Grade A）：殘留深囊袋伴隨 ≥ 3 mm 骨內缺損，建議再生手術。"),ev("nib20a","再生 vs 翻瓣清創：附連獲得 +1.34 mm（95% CI 0.95–1.73）；EMD +1.27、GTR +1.43 mm。"),ev("sta21","中長期各再生術式仍優於清創，聯合療法殘留囊袋較淺。")]});
    // 預後
    const pro=[];
    if(S.angle==="n") pro.push("窄角（≤ 25°）"); if(S.angle==="w") pro.push("寬角（≥ 37°）");
    if(S.walls==="3"||S.walls==="2g") pro.push("骨壁支撐佳"); if(S.walls==="poor") pro.push("骨壁少");
    const good=(S.angle==="n"?1:S.angle==="w"?-1:0)+((S.walls==="3"||S.walls==="2g")?1:S.walls==="poor"?-1:0);
    add(b,{g:"E",lvl:good<0?"warn":"",t:`缺損預後：${good>0?"有利":good<0?"較不利":"中等"}`,d:`${pro.join("、")||"角度、骨壁中等"}。缺損越深、越窄、骨壁越多，結果越好，且與材料無關。`,ev:[ev("nib20b","角度 < 37° 約多 1 mm 附連獲得；每多一壁約多 0.5 mm。"),ev("ct15","≤ 25° 比 ≥ 37° 平均多 1.6 mm 附連獲得。"),ev("tsi04","EMD：≤ 22° 時附連獲得 > 3 mm 的勝算是 ≥ 36° 的 2.46 倍。")]});
  } else if(S.type==="intra"&&S.depth==="lt3"){
    add(b,{g:"B",t:"切除性骨手術（骨切除＋骨整形）",d:"淺骨內缺損以骨切除消除囊袋，配合根向位移翻瓣。囊袋消除率高，但會增加牙齦退縮與附連喪失。",ev:[ev("car00","骨切除用於淺（1–2 mm）到中等（3–4 mm）骨內與半隔缺損；原則上 ≤ 3 mm 才適合。"),ev("s3","R3.3（Grade B）：第三期牙周炎殘留 ≥ 6 mm，建議切除性手術，但要考量退縮增加。"),ev("fer20","12 個月囊袋消除（PD ≤ 4 mm）98.3%（95% CI 96.8–99.7）；退縮 ORS 2.33 mm、FibReORS 1.72 mm。"),ev("cat81","猴子骨切除：鄰接未受波及牙附連多喪失 1.34 mm。")]});
  } else if(S.type==="crater"){
    add(b,{g:"B",t:"切除性骨手術",d:"坑狀缺損以骨切除去除較薄的一側骨壁（常為舌側），做出頰向舌的斜坡（ramping），恢復正向骨形態。",ev:[ev("car00","2 壁鄰接面坑狀缺損多去除舌側骨壁，形成由頰向舌的斜坡；終點是正向骨形態與最淺探測深度。"),ev("s3","R3.3（Grade B）：殘留 ≥ 6 mm 可用切除性手術，需考量退縮。"),ev("fer20","12 個月囊袋消除 98.3%。")]});
  } else if(S.type==="irreg"){
    add(b,{g:"E",t:"骨整形（± 骨切除）",d:"骨架、外生骨疣、厚鄰接面與骨形態反轉，以骨整形修整，不移除支持骨；需要時配合骨切除。",ev:[ev("car00","骨整形用於頰舌側骨架或骨隆突、淺頰舌側骨內缺損、厚鄰接面與初期根岔侵犯，不需移除支持骨；骨切除可矯正骨形態反轉。")]});

const GL={A:"Grade A",B:"Grade B",Z:"Grade 0",E:"證據",I:"低確定性"};
function renderResult(){
  used.clear();
  const d=decide();
  let h=`<section class="card"><h2>決策摘要</h2>`;
  // 路徑
  const labels=[];
  Object.entries(Q).forEach(([id,qs])=>qs.forEach(q=>{ if(S[q.k]!==undefined&&(!q.show||q.show(S))){ const o=q.opts.find(o=>o[0]===S[q.k]); if(o) labels.push(`${q.lab.replace(/（.*）/,"")}：${o[1]}`);} }));
  h+=`<div class="path">${labels.map(l=>`<span>${esc(l)}</span>`).join("")}</div></section>`;
  h+=`<section class="card">`;
  d.forEach(s=>{
    if(!s.items.length) return;
    h+=`<div class="res-sec"><h3>${s.title}</h3>`;
    s.items.forEach(it=>{
      it.ev.forEach(e=>used.add(e.k));
      h+=`<div class="rec ${it.lvl?"lvl-"+it.lvl:""}"><div class="t">${it.g?`<span class="grade ${it.g}">${GL[it.g]}</span>`:""}${esc(it.t)}</div>${it.d?`<div class="d">${esc(it.d)}</div>`:""}${evHTML(it.ev)}</div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="legend"><span><span class="grade A">Grade A</span> EFP 強烈建議</span><span><span class="grade B">Grade B</span> 建議</span><span><span class="grade Z">Grade 0</span> 可考慮</span><span><span class="grade E">證據</span> SR／研究支持的補充</span></div></section>`;
  // 文獻
  const list=[...used].map(k=>R[k]);
  h+=`<section class="card refs"><h2>本次引用文獻</h2><ol>${list.map(r=>`<li>${esc(r.a)}. ${esc(r.t)}. <i>${esc(r.j)}</i>. ${esc(r.ty)}<span class="tag">${esc(r.src)}</span> PMID <a href="https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/" target="_blank" rel="noopener">${r.pmid}</a>${r.doi?` ・ DOI ${esc(r.doi)}`:" ・ DOI ⚠ 待確認"}</li>`).join("")}</ol></section>`;
  h+=`<div class="nav"><button class="btn ghost" id="back">上一步</button><span style="display:flex;gap:8px"><button class="btn ghost" id="copy">複製摘要</button><button class="btn" id="reset">重新開始</button></span></div>`;
  $("#main").innerHTML=h;
  $("#back").onclick=()=>{ cur=stopped()?0:STEPS.length-2; render(); window.scrollTo(0,0); };
  $("#reset").onclick=()=>{ S={}; cur=0; used.clear(); render(); window.scrollTo(0,0); };
  $("#copy").onclick=async()=>{
    let txt="【牙周手術決策摘要】\n"+labels.join("\n")+"\n";
    d.forEach(s=>{ if(!s.items.length) return; txt+=`\n■ ${s.title}\n`; s.items.forEach(it=>{ if(it.small) return; txt+=`・${it.g?"["+GL[it.g]+"] ":""}${it.t}${it.d?"："+it.d:""}\n  依據：${it.ev.map(e=>R[e.k].a+"（PMID "+R[e.k].pmid+"）").join("；")}\n`; }); });
    try{ await navigator.clipboard.writeText(txt); toast("已複製"); }catch(e){ toast("無法複製，請改用截圖"); }
  };
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

if(cur>maxReach()) cur=maxReach();
render();
